<svg xmlns="http://www.w3.org/2000/svg" width="2240" height="956" viewBox="0 0 2240 956">
  <defs>
    <linearGradient id="desk" x1="0" y1="0" x2="0.25" y2="1">
      <stop offset="0" stop-color="#5f7dfb"/>
      <stop offset="1" stop-color="#8b5ff6"/>
    </linearGradient>
    <clipPath id="clipBefore"><rect x="112" y="170" width="840" height="540" rx="22"/></clipPath>
    <clipPath id="clipAfter"><rect x="1288" y="170" width="840" height="540" rx="22"/></clipPath>
